<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --green:#1f8f4e; --bg:#f4f6f5; --card:#fff; --text:#1b1f1d; --muted:#6b7570; --err:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--green); color:#fff; padding:16px; font-weight:700; font-size:20px; letter-spacing:.5px; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; display:block; text-align:center; padding:14px; border-radius:999px; border:2px solid var(--green);
         color:var(--green); background:#fff; font-weight:600; cursor:pointer; font-size:16px; }
  .btn.primary { background:var(--green); color:#fff; width:100%; }
  .btn:disabled { opacity:.5; }
  input[type=file] { display:none; }
  label.f { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid #cfd6d2; border-radius:8px; background:#fff; }
  input[readonly] { background:#eef1ef; }
  #preview { width:100%; max-height:260px; object-fit:contain; border-radius:8px; margin-top:12px; display:none; }
  .status { min-height:22px; font-size:14px; margin-top:8px; }
  .err { color:var(--err); }
  .ok { color:var(--green); font-weight:600; }
</style>
</head>
<body>
<header>PETTY CASH APP</header>
<main>
  <div class="card">
    <div class="btns">
      <label class="btn" for="cam">📷 Capture</label>
      <label class="btn" for="upl">⬆ Upload</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <input id="upl" type="file" accept="image/*">
    <img id="preview" alt="Invoice preview">
    <div id="readStatus" class="status"></div>
  </div>

  <form class="card" id="form">
    <label class="f">Entry Date</label>
    <input value="<?= today ?>" readonly>

    <label class="f" for="type">Transaction Type</label>
    <select id="type" required></select>

    <label class="f" for="category">Payment For</label>
    <select id="category" required><option value="">Select…</option></select>

    <label class="f" for="receipt">Receipt #</label>
    <input id="receipt">

    <label class="f" for="invoiceDate">Invoice Date</label>
    <input id="invoiceDate" type="date">

    <label class="f" for="amount">Amount (AED, incl. VAT)</label>
    <input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required>

    <p></p>
    <button class="btn primary" id="save" type="submit">Save to Petty Cash Sheet</button>
    <div id="saveStatus" class="status"></div>
  </form>
</main>
<script>
  const TYPES = <?!= JSON.stringify(types) ?>;
  const CATEGORIES = <?!= JSON.stringify(categories) ?>;
  const $ = (id) => document.getElementById(id);
  TYPES.forEach(t => $('type').add(new Option(t, t)));
  CATEGORIES.forEach(c => $('category').add(new Option(c, c)));

  let photo = null;

  function status(id, text, cls) { $(id).textContent = text; $(id).className = 'status ' + (cls || ''); }

  // Phone photos are several MB; downscale before sending to Apps Script.
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Could not open this image.'));
      img.src = URL.createObjectURL(file);
    });
  }

  async function onPick(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const dataUrl = await shrink(file);
      $('preview').src = dataUrl;
      $('preview').style.display = 'block';
      photo = { base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg' };
      status('readStatus', 'Reading invoice… (up to 30 seconds)');
      status('saveStatus', '');
      $('save').disabled = true;
      google.script.run
        .withSuccessHandler(d => {
          if (d.receipt_number) $('receipt').value = d.receipt_number;
          if (d.invoice_date) $('invoiceDate').value = d.invoice_date;
          if (d.total_amount > 0) $('amount').value = d.total_amount.toFixed(2);
          status('readStatus', 'Check the details, choose Payment For, then save.', 'ok');
          $('save').disabled = false;
        })
        .withFailureHandler(err => {
          status('readStatus', 'Could not read the receipt: ' + err.message, 'err');
          $('save').disabled = false;
        })
        .extractInvoice(photo.base64, photo.mimeType);
    } catch (err) {
      status('readStatus', err.message, 'err');
    }
  }
  $('cam').addEventListener('change', onPick);
  $('upl').addEventListener('change', onPick);

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    $('save').disabled = true;
    status('saveStatus', 'Saving…');
    google.script.run
      .withSuccessHandler(r => {
        status('saveStatus', 'Saved to row ' + r.row + '. Balance: AED ' + Number(r.balance).toFixed(2), 'ok');
        status('readStatus', '');
        $('form').reset();
        $('preview').style.display = 'none';
        photo = null;
        $('save').disabled = false;
      })
      .withFailureHandler(err => { status('saveStatus', err.message, 'err'); $('save').disabled = false; })
      .saveEntry({
        type: $('type').value,
        category: $('category').value,
        receipt: $('receipt').value,
        invoiceDate: $('invoiceDate').value,
        amount: $('amount').value,
        photo: photo,
      });
  });
</script>
</body>
</html>
